services:
  redis:
    image: redis:7-alpine
    container_name: radius_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - radius_net

  postgres:
    image: postgres:15-alpine
    container_name: radius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radius}
      POSTGRES_USER: ${POSTGRES_USER:-radius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radiuspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - radius_net

  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    container_name: radius_freeradius
    restart: unless-stopped
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
    networks:
      - radius_net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: radius_web
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      SGP_URL: https://linknetam.sgp.net.br/api/ura/consultacliente/
      SGP_TOKEN: ${SGP_TOKEN:-}
      SGP_APP: ${SGP_APP:-APP}
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-secreta}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - radius_net

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: radius_sync
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      SGP_URL: https://linknetam.sgp.net.br/api/ura/consultacliente/
      SGP_TOKEN: ${SGP_TOKEN:-}
      SGP_APP: ${SGP_APP:-APP}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Configurações SMTP para notificações por email (opcional)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    networks:
      - radius_net

volumes:
  postgres_data:

networks:
  radius_net:
    driver: bridge
