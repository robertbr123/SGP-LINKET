services:
  wireguard:
    image: ghcr.io/wg-easy/wg-easy:latest
    container_name: radius_wireguard
    restart: unless-stopped
    environment:
      - LANG=pt
      - WG_HOST=${WG_HOST:-0.0.0.0}
      - PASSWORD_HASH=${WG_PASSWORD_HASH}
      - PORT=47321
      - WG_PORT=${WG_UDP_PORT:-47320}
      - WG_DEFAULT_ADDRESS=10.73.91.x
      - WG_DEFAULT_DNS=1.1.1.1
      - WG_ALLOWED_IPS=10.73.91.0/24
      - WG_PERSISTENT_KEEPALIVE=25
      - UI_TRAFFIC_STATS=true
      - UI_CHART_TYPE=1
    volumes:
      - wireguard_data:/etc/wireguard
    ports:
      - "${WG_UDP_PORT:-47320}:${WG_UDP_PORT:-47320}/udp"
      - "47321:47321/tcp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      radius_net: {}
      wg_net:
        ipv4_address: 172.28.0.2

  # ---------------------------------------------------------------------------
  # Sidecar: configura roteamento para a rede do SGP via WireGuard → MikroTik → L2TP.
  # Roda no namespace de rede do WireGuard para ter acesso à interface wg0.
  #
  # Adiciona as redes SGP (172.16.116.0/24, 172.16.117.0/24) aos AllowedIPs
  # de TODOS os peers MikroTik listados em SGP_WG_PEER_KEYS, para que o
  # tráfego destinado ao SGP passe pelo túnel WireGuard até qualquer MikroTik
  # que tenha a VPN L2TP com o SGP.
  # ---------------------------------------------------------------------------
  route-sgp:
    image: alpine:3.19
    container_name: radius_route_sgp
    network_mode: "service:wireguard"
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      - wireguard
    environment:
      # Chaves públicas dos peers MikroTik (separadas por vírgula)
      # Cada MikroTik que tem VPN L2TP com o SGP precisa estar aqui.
      # Para descobrir a chave: wg show wg0 allowed-ips (no container wireguard)
      SGP_WG_PEER_KEYS: ${SGP_WG_PEER_KEYS:-T0IU0nE43dYEtcf+6IvBTVLy4UP5NFXxIglas4UblT0=}
    command: >
      sh -c "
        apk add --no-cache iptables wireguard-tools > /dev/null 2>&1;
        echo '[route-sgp] Configurando roteamento SGP via WireGuard...';
        echo '[route-sgp] Peers: '$$SGP_WG_PEER_KEYS;
        while true; do
          IFS=',' ; for PKEY in $$SGP_WG_PEER_KEYS; do
            CURRENT=$$(wg show wg0 allowed-ips 2>/dev/null | grep \"$$PKEY\" | awk '{$$1=\"\"; gsub(/[ \\t]+/,\",\"); sub(/^,/,\"\"); print}');
            if [ -n \"$$PKEY\" ] && ! echo \"$$CURRENT\" | grep -q '172.16.116.0/24'; then
              NEW=\"$$CURRENT,172.16.116.0/24,172.16.117.0/24\";
              NEW=$$(echo \"$$NEW\" | sed 's/,,/,/g; s/^,//; s/,$$//');
              wg set wg0 peer \"$$PKEY\" allowed-ips \"$$NEW\" 2>/dev/null &&
                echo \"[route-sgp] AllowedIPs atualizados para peer $$PKEY\";
            fi;
          done; unset IFS;
          ip route replace 172.16.116.0/24 dev wg0 2>/dev/null;
          ip route replace 172.16.117.0/24 dev wg0 2>/dev/null;
          iptables -t nat -C POSTROUTING -o wg0 -d 172.16.116.0/24 -j MASQUERADE 2>/dev/null ||
            iptables -t nat -A POSTROUTING -o wg0 -d 172.16.116.0/24 -j MASQUERADE;
          iptables -t nat -C POSTROUTING -o wg0 -d 172.16.117.0/24 -j MASQUERADE 2>/dev/null ||
            iptables -t nat -A POSTROUTING -o wg0 -d 172.16.117.0/24 -j MASQUERADE;
          sleep 30;
        done
      "

  redis:
    image: redis:7-alpine
    container_name: radius_redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    networks:
      - radius_net

  postgres:
    image: postgres:15-alpine
    container_name: radius_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radius}
      POSTGRES_USER: ${POSTGRES_USER:-radius}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radiuspassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radius} -d ${POSTGRES_DB:-radius}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - radius_net

  freeradius:
    build:
      context: ./freeradius
      dockerfile: Dockerfile
    container_name: radius_freeradius
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    depends_on:
      postgres:
        condition: service_healthy
      route-sgp:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      # Gateway para a rede do SGP (IP do WireGuard na rede Docker wg_net)
      SGP_ROUTE_GW: 172.28.0.2
      # --- Encaminhamento de accounting ao RADIUS do SGP ---
      # Configure as variáveis abaixo no seu .env conforme o seu SGP
      SGP_RADIUS_ENABLED: ${SGP_RADIUS_ENABLED:-true}
      SGP_RADIUS_HOST: ${SGP_RADIUS_HOST:-172.16.116.1}
      SGP_RADIUS_ACCT_PORT: ${SGP_RADIUS_ACCT_PORT:-2052}
      SGP_RADIUS_SECRET: ${SGP_RADIUS_SECRET:-sgp@radius}
      # --- Mapeamento de NAS-IP (múltiplos MikroTiks) ---
      # Formato: "ip_wireguard1=ip_sgp1,ip_wireguard2=ip_sgp2"
      # O ip_wireguard é o IP do MikroTik no WireGuard (10.73.91.x)
      # O ip_sgp é o IP do NAS cadastrado no SGP (172.16.117.x)
      SGP_NAS_IP_MAP: ${SGP_NAS_IP_MAP:-10.73.91.5=172.16.117.12}
      # Fallback: usado se o NAS-IP não estiver no mapa acima
      SGP_NAS_IP_OVERRIDE: ${SGP_NAS_IP_OVERRIDE:-172.16.117.12}
      # Mapeamento de Nome Identificador: IP_WireGuard=NomeNoSGP (vírgula)
      SGP_NAS_ID_MAP: ${SGP_NAS_ID_MAP:-10.73.91.5=ONDELINE_NET}
      # Fallback de Nome Identificador se o IP não estiver no mapa
      SGP_NAS_IDENTIFIER: ${SGP_NAS_IDENTIFIER:-ONDELINE_NET}
      # Debug: "true" loga cada packet de accounting encaminhado ao SGP
      SGP_ACCT_DEBUG: ${SGP_ACCT_DEBUG:-false}
    networks:
      radius_net: {}
      wg_net:
        ipv4_address: 172.28.0.10

  # Sidecar: redireciona porta 1812/1813 do WireGuard para o FreeRADIUS
  radius-forward:
    image: alpine:3.19
    container_name: radius_forward
    restart: unless-stopped
    network_mode: "service:wireguard"
    cap_add:
      - NET_ADMIN
    depends_on:
      - wireguard
      - freeradius
    command: >
      sh -c "
        apk add --no-cache iptables &&
        while true; do
          iptables -t nat -C PREROUTING -p udp --dport 1812 -j DNAT --to-destination 172.28.0.10:1812 2>/dev/null ||
            iptables -t nat -A PREROUTING -p udp --dport 1812 -j DNAT --to-destination 172.28.0.10:1812;
          iptables -t nat -C PREROUTING -p udp --dport 1813 -j DNAT --to-destination 172.28.0.10:1813 2>/dev/null ||
            iptables -t nat -A PREROUTING -p udp --dport 1813 -j DNAT --to-destination 172.28.0.10:1813;
          iptables -t nat -C POSTROUTING -p udp -d 172.28.0.10 --dport 1812 -j MASQUERADE 2>/dev/null ||
            iptables -t nat -A POSTROUTING -p udp -d 172.28.0.10 --dport 1812 -j MASQUERADE;
          iptables -t nat -C POSTROUTING -p udp -d 172.28.0.10 --dport 1813 -j MASQUERADE 2>/dev/null ||
            iptables -t nat -A POSTROUTING -p udp -d 172.28.0.10 --dport 1813 -j MASQUERADE;
          iptables -C FORWARD -p udp -d 172.28.0.10 -j ACCEPT 2>/dev/null ||
            iptables -A FORWARD -p udp -d 172.28.0.10 -j ACCEPT;
          iptables -t nat -C POSTROUTING -o wg0 -j MASQUERADE 2>/dev/null ||
            iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE;
          sleep 30;
        done
      "

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: radius_web
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      wireguard:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      SGP_URL: https://linknetam.sgp.net.br/api/ura/consultacliente/
      SGP_TOKEN: ${SGP_TOKEN:-}
      SGP_APP: ${SGP_APP:-APP}
      SECRET_KEY: ${SECRET_KEY:-troque-esta-chave-secreta}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NOC_CHURN_WARN_PCT: ${NOC_CHURN_WARN_PCT:-5}
      NOC_CHURN_CRIT_PCT: ${NOC_CHURN_CRIT_PCT:-12}
      NOC_AAA_WARN_PCT: ${NOC_AAA_WARN_PCT:-2}
      NOC_AAA_CRIT_PCT: ${NOC_AAA_CRIT_PCT:-8}
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs-nbi:7557}
    networks:
      - radius_net
      - wg_net

  sync:
    build:
      context: ./sync
      dockerfile: Dockerfile
    container_name: radius_sync
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      wireguard:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      SGP_URL: https://linknetam.sgp.net.br/api/ura/consultacliente/
      SGP_TOKEN: ${SGP_TOKEN:-}
      SGP_APP: ${SGP_APP:-APP}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-300}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OFFLINE_ALERT_DAYS: ${OFFLINE_ALERT_DAYS:-0}
      SYNC_MAX_DURATION: ${SYNC_MAX_DURATION:-600}
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs-nbi:7557}
      CPE_POLL_INTERVAL: ${CPE_POLL_INTERVAL:-60}
      # Análise IA (auto-detecta o provider baseado em qual var está setada)
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CF_AI_TOKEN: ${CF_AI_TOKEN:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    networks:
      - radius_net
      - wg_net

  # ---------------------------------------------------------------------------
  # Backup automático (Postgres + Mongo) → Cloudflare R2
  # Roda diariamente via cron interno; notifica Telegram em sucesso/falha.
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: radius_backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      MONGO_HOST: mongodb
      # Cloudflare R2 (preencha no .env)
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-sgp-linket-backups}
      # Subpasta dentro do bucket (útil pra reusar bucket compartilhado).
      # Vazio = backup vai direto na raiz do bucket.
      # Ex: R2_PREFIX=SGP-LINKET → dokploy/SGP-LINKET/2026/05/...
      R2_PREFIX: ${R2_PREFIX:-}
      # Schedule
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_MINUTE: ${BACKUP_MINUTE:-0}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      RUN_ON_START: ${BACKUP_RUN_ON_START:-false}
    networks:
      - radius_net

  # ---------------------------------------------------------------------------
  # Mini App — Telegram WebApp (HTML+JS servido via HTTPS)
  # Exposto via nginx-proxy-manager em domínio público com TLS.
  # ---------------------------------------------------------------------------
  mini-app:
    build:
      context: ./mini_app
      dockerfile: Dockerfile
    container_name: radius_mini_app
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      wireguard:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs-nbi:7557}
    ports:
      - "5001:5001"
    networks:
      - radius_net
      - wg_net

  # ---------------------------------------------------------------------------
  # Bot Telegram interativo (long polling)
  # Recebe comandos /status /cliente /online /desconectar /reiniciar_cpe /silenciar
  # ---------------------------------------------------------------------------
  telegram-bot:
    build:
      context: ./telegram_bot
      dockerfile: Dockerfile
    container_name: radius_telegram_bot
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      wireguard:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_NAME: radius
      DB_USER: radius
      DB_PASS: ${POSTGRES_PASSWORD:-radiuspassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs-nbi:7557}
    networks:
      - radius_net
      - wg_net

  # ---------------------------------------------------------------------------
  # Prometheus — coleta métricas do /metrics do web
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: radius_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    depends_on:
      - web
    networks:
      - radius_net

  # ---------------------------------------------------------------------------
  # Grafana — dashboards operacionais
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: radius_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_HTTP_PORT: 3000
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3015:3000"
    depends_on:
      - prometheus
    networks:
      - radius_net

  # ---------------------------------------------------------------------------
  # GenieACS — ACS para TR-069 (gerência remota de CPEs/ONUs/roteadores)
  # ---------------------------------------------------------------------------
  mongodb:
    image: mongo:4.4
    container_name: genieacs_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - radius_net

  genieacs-cwmp:
    build:
      context: ./genieacs
      dockerfile: Dockerfile
    image: sgp-genieacs:local
    container_name: genieacs_cwmp
    restart: unless-stopped
    command: genieacs-cwmp
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongodb/genieacs
      GENIEACS_CWMP_SSL: "false"
      GENIEACS_CWMP_PORT: "7547"
      GENIEACS_CWMP_INTERFACE: "0.0.0.0"
    ports:
      - "7547:7547"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - radius_net

  genieacs-nbi:
    build:
      context: ./genieacs
      dockerfile: Dockerfile
    image: sgp-genieacs:local
    container_name: genieacs_nbi
    restart: unless-stopped
    command: genieacs-nbi
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongodb/genieacs
      GENIEACS_NBI_PORT: "7557"
      GENIEACS_NBI_INTERFACE: "0.0.0.0"
    ports:
      - "7557:7557"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - radius_net

  genieacs-ui:
    build:
      context: ./genieacs
      dockerfile: Dockerfile
    image: sgp-genieacs:local
    container_name: genieacs_ui
    restart: unless-stopped
    command: genieacs-ui
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongodb/genieacs
      GENIEACS_UI_PORT: "3000"
      GENIEACS_UI_JWT_SECRET: ${SECRET_KEY:-troque-esta-chave-secreta}
    ports:
      - "3001:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - radius_net

volumes:
  postgres_data:
  wireguard_data:
  mongo_data:
  prometheus_data:
  grafana_data:

networks:
  radius_net:
    driver: bridge
  wg_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
