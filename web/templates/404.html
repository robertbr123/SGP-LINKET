{% extends "base.html" %}
{% block title %}Página não encontrada — RADIUS Manager{% endblock %}
{% block page_title %}Erro 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem;color:#cbd5e1">404</div>
    <h4 class="fw-semibold text-slate-700 mt-2">Página não encontrada</h4>
    <p class="text-muted mb-4">A página que você está procurando não existe ou foi movida.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
        <i class="bi bi-house-fill me-2"></i>Voltar ao Dashboard
    </a>
</div>
{% endblock %}
