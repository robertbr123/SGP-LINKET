<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}RADIUS Manager{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .badge-ativo { background-color: #198754; }
        .badge-suspenso { background-color: #dc3545; }
        .badge-pendente { background-color: #6c757d; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">
            <i class="bi bi-wifi"></i> RADIUS Manager
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('index') }}"><i class="bi bi-people"></i> Clientes</a>
            <a class="nav-link" href="{{ url_for('gerenciar_planos') }}"><i class="bi bi-speedometer2"></i> Planos</a>
            <a class="nav-link" href="{{ url_for('gerenciar_pools') }}"><i class="bi bi-diagram-3"></i> Pools</a>
            <a class="nav-link" href="{{ url_for('gerenciar_nas') }}"><i class="bi bi-router"></i> NAS</a>
        </div>
    </div>
</nav>
<div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
                {{ msg }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
